services:

  # ── MongoDB (Documento) ───────────────────────────────────────────
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: mongo
      ME_CONFIG_BASICAUTH_PASSWORD: mongo

  # ── Redis (Chave-Valor) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  redisinsight:
    image: redislabs/redisinsight:latest
    ports:
      - "5540:5540"
    restart: always

  # ── Cassandra (Colunar) ───────────────────────────────────────────
  cassandra:
    image: cassandra:4
    restart: always
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=EcommerceCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ── Neo4j (Grafo) ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    restart: always
    ports:
      - "7474:7474"   # Browser / HTTP API
      - "7687:7687"   # Bolt (driver Python)
    environment:
      - NEO4J_AUTH=neo4j/neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
